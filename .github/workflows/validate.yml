name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Only integrations in Home Assistant's brands repository have a logo there.
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.13"   # Home Assistant 2026.2
          - python: "3.14"   # the newest Home Assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements_test.txt
      - name: Install the frontend that matches the installed Home Assistant
        run: pip install "$(python scripts/frontend_requirement.py)"
      - run: pytest -q
      - run: node --test tests/js/*.test.mjs
