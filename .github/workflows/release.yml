name: Release

# Merging a change to the version in manifest.json creates the GitHub release
# (for example v0.1.2) that HACS shows as an update.
on:
  push:
    branches: [main]
    paths: [custom_components/box_zones/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if this version has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/box_zones/manifest.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
